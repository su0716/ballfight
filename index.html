<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>볼파이트</title>
<meta name="description" content="공들이 튕기며 싸우는 볼파이트 — 캐릭터를 골라 팀전·리그·보스전을 즐겨보세요">
<meta property="og:title" content="볼파이트">
<meta property="og:description" content="공들이 튕기며 싸우는 쇼츠 스타일 배틀 게임">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23e5483b' stroke='%23111' stroke-width='5'/%3E%3Ccircle cx='24' cy='24' r='7' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 쇼츠 화면처럼 어두운 무대 위에 흰 카드 한 장 — 경기장 아래로 선수 카드(이름, 체력바, 공격 탭)가 격자로 쌓인다 */
:root{
  color-scheme: dark;
  --stage:#141519;
  --stage-2:#1f2128;
  --card:#ffffff;
  --ink:#111114;
  --line:#0b0b0d;
  --muted:#7b7e88;
  --hp:#2fca5a;
  --hp-mid:#f2b630;
  --hp-low:#e5483b;
  --trail:#f6f1d9;
  --staff:#f4b81c;
  --btn:#111114;
  --btn-ink:#ffffff;
  --panel:#f3f3f1;
  --display:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --on-stage:#e8e8ea;
  --stage-soft:rgba(255,255,255,.08);
  --stage-edge:rgba(255,255,255,.25);
  --shadow:rgba(0,0,0,.45);
}
/* 밝은 화면 (왼쪽 아래 버튼) */
:root[data-skin="light"]{
  color-scheme: light;
  --stage:#e4e6ea;
  --stage-2:#ffffff;
  --on-stage:#1d1f24;
  --stage-soft:rgba(0,0,0,.04);
  --stage-edge:rgba(0,0,0,.18);
  --shadow:rgba(40,45,60,.18);
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;background:radial-gradient(ellipse at top,var(--stage-2),var(--stage) 70%) fixed,var(--stage);
  color:var(--ink);font-family:var(--body);
  padding-inline:16px;padding-block:20px 32px;box-sizing:border-box;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.main,.side{display:flex;flex-direction:column;gap:14px;min-width:0}
/* 넓은 화면: 왼쪽 경기, 오른쪽 조작·선수·설명 */
@media (min-width:1000px){
  .wrap{max-width:1180px;display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);align-items:start}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
}
.panel{background:var(--panel);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.desc-char{background:#fff;border:2px solid var(--line);border-radius:4px;padding:8px 10px}
.desc-char h5{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:16px}
.desc-char dl{margin:0;display:grid;gap:4px}
.desc-char dt{font-weight:700;font-size:13px}
.desc-char dd{margin:0 0 4px;font-size:12px;line-height:1.45;color:#333}
.league{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.league small{color:var(--muted);font-size:12px;max-width:300px}
.card{background:var(--card);padding:18px 18px 16px;border-radius:4px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px var(--shadow)}
.arena-box{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border:4px solid var(--line);box-sizing:border-box;background:#fff}
canvas{display:block}
#arena{width:100%;height:100%;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.72);text-align:center;padding:16px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,44px);margin:0;line-height:1.1;text-wrap:balance;color:var(--ink)}
.overlay p{margin:0;color:var(--muted);font-size:14px}
.win-face{width:120px;height:120px;background:center/contain no-repeat}

.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px 20px}
.pcard{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.dead{opacity:.45}
.pname{font-family:var(--display);font-size:clamp(18px,5vw,26px);line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pname i{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.minis{display:flex;gap:5px;align-items:center;font-size:11px;font-weight:700;color:#555}
.mini{flex:1;height:9px;border:1.5px solid var(--line);background:#2a2b30;position:relative;overflow:hidden}
.mini i{position:absolute;inset:0 auto 0 0;background:#ef7fb0}
.bar{position:relative;height:24px;border:2px solid var(--line);background:#2a2b30;overflow:hidden}
.bar .trail,.bar .fill{position:absolute;inset:0 auto 0 0;width:100%}
.bar .trail{background:var(--trail)}
.bar .fill{background:var(--hp);transition:background-color .3s}
.bar span{position:relative;display:flex;height:100%;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.atk{border:2px solid var(--line);min-width:0}
.atk h3{margin:0;background:var(--line);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 8px}
.atk ul{list-style:none;margin:0;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.atk li{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.35}
.atk li b{font-size:13px}
.atk li.on{background:#fff4d1;box-shadow:-8px 0 0 #fff4d1,8px 0 0 #fff4d1}
.atk li.on b::after{content:" · 사용 중";color:#c07a00;font-size:11px}
.atk .stat{color:#555;font-variant-numeric:tabular-nums}
.atk .none{color:var(--muted)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vol{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--on-stage);background:var(--stage-soft);border:2px solid var(--stage-edge);border-radius:3px;padding:5px 10px}
.skin{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 14px var(--shadow)}
.skin svg{width:22px;height:22px}
.set-btn{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#skinBtn{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-checked="true"]{background:var(--btn);color:var(--btn-ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.help{position:fixed;inset:0;z-index:60;background:rgba(10,10,14,.55);display:grid;place-items:center;padding:16px}
.help-box{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:6px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.help-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.help-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.help h4{margin:0 0 6px;font-size:14px;letter-spacing:.04em}
.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.55}
.help .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0 0 8px;font-size:13px;align-items:center}
.help .keys dd{margin:0}
.help kbd{display:inline-block;min-width:22px;text-align:center;font:700 12px/1.6 var(--body);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:0 6px;background:#fafafa}
.help-note{margin:6px 0 0;font-size:12px;color:var(--muted)}
.vol input{width:110px;accent-color:#f2b630}
.vol span{min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
button{font-family:var(--body);font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--btn);color:var(--btn-ink);padding:9px 14px;border-radius:3px;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink)}
button[aria-pressed="true"]{background:#c8372c;color:#fff}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hp-mid);outline-offset:2px}
.big{font-size:18px;padding:12px 26px}

.slots{background:var(--panel);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.slots-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.slots-head h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.slot{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:4px;padding:8px}
.slot .no{font-family:var(--display);font-size:18px;width:22px;text-align:center}
.slot canvas{width:44px;height:44px}
.slot .fields{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.slot .fields>*{min-width:0}
.slot .x{padding:4px 10px;font-size:16px;line-height:1}
.slot select{flex:1 1 90px}
.slot input[type=text]{flex:2 1 90px}
.slot input[type=number]{flex:0 1 70px;width:70px}
.swatches{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1 1 100%}
.slot .sw{width:20px;height:20px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #aaa;cursor:pointer}
.slot .sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--line);transform:scale(1.12)}
.slot .sw:hover{filter:none;transform:scale(1.12)}
.mode{font-size:12px;font-weight:700;color:var(--muted)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{touch-action:none;position:relative;width:52px;height:52px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;cursor:grab;background:#fff;padding:0}
.pal:hover,.pal:focus-visible{border-color:var(--line)}
.pal canvas{width:44px;height:44px;pointer-events:none}
.pal::after{content:attr(data-name);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--line);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.pal:hover::after,.pal:focus-visible::after{opacity:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;border-bottom:2px solid var(--line);padding-top:4px}
.tab{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:#fff;color:var(--ink);padding:6px 10px;font-size:13px;margin-bottom:-2px}
.tab i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.tab[aria-selected="true"]{background:var(--panel);padding-bottom:9px}
.tab.drop{outline:3px dashed var(--line);outline-offset:2px}
.tab .faces{display:inline-flex;gap:1px}
.tab .faces canvas{width:20px;height:20px}
.tab .cnt{font-size:11px;color:#8a8f99;font-weight:700}
.tab .del{font-size:13px;color:#888;padding:0 2px;cursor:pointer}
.tab .del:hover{color:#c8372c}
.addtab{border:2px dashed var(--line);border-radius:6px 6px 0 0;background:transparent;color:var(--ink);padding:5px 12px;font-size:16px;margin-bottom:-2px}
.teambox{display:flex;flex-direction:column;gap:6px;min-height:64px;padding:8px;border:2px solid var(--line);border-top:none;background:var(--panel)}
.teambox.drop{outline:3px dashed var(--line);outline-offset:-6px}
.teambox .empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0}
.slot .tm{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.file{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border:1px solid #bbb;border-radius:3px;padding:6px 8px;cursor:pointer;color:#333;background:#fafafa}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file:focus-within{outline:3px solid var(--hp-mid)}
input[type=text],input[type=number],select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #bbb;border-radius:3px;background:#fff;color:var(--ink);color-scheme:light;min-width:0}
.hint{font-size:12px;color:var(--muted);margin:0}
.bosspicks{display:flex;gap:6px;flex-wrap:wrap}
.bosspick{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;font-weight:700}
.bosspick canvas{width:36px;height:36px}
.bosspick[aria-pressed="true"]{outline:3px solid #c8372c;outline-offset:1px}
.bosshp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.bosshp input{width:110px}
</style>
</head>
<body>
<button class="ghost skin" id="skinBtn" type="button" aria-label="밝은 화면으로"></button>
<button class="ghost skin set-btn" id="helpBtn" type="button" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div class="help" id="helpOv" hidden role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="help-box">
    <div class="help-head"><h3 id="helpTitle">설정</h3><button class="ghost" id="helpClose" type="button" aria-label="닫기">닫기</button></div>
    <section>
      <h4>체력 표시</h4>
      <div class="seg" role="radiogroup" aria-label="체력 표시">
        <button class="ghost" type="button" role="radio" data-hp="card">체력바만</button>
        <button class="ghost" type="button" role="radio" data-hp="over">머리 위</button>
        <button class="ghost" type="button" role="radio" data-hp="ring">테두리</button>
      </div>
    </section>
    <section>
      <h4>맵 크기 <span id="mapTx">100%</span></h4>
      <input type="range" id="mapSl" min="60" max="160" step="10" value="100" aria-label="맵 크기" style="width:100%;accent-color:#f2b630">
    </section>
    <section class="opts">
      <button class="ghost" id="bossBarToggle" type="button" aria-pressed="true">보스 체력바</button>
      <button class="ghost" id="timerToggle" type="button" aria-pressed="false">타이머</button>
      <button class="ghost" id="hbToggle" type="button" aria-pressed="false">히트박스 (H)</button>
    </section>
  </div>
</div>
<div class="wrap">
  <div class="main">
  <div class="card">
    <div class="arena-box">
      <canvas id="arena" aria-label="볼파이트 경기장"></canvas>
      <div class="overlay" id="startOv">
        <h2>볼파이트</h2>
        <p id="startHint">아래에서 선수를 고르고 경기를 시작하세요</p>
        <button class="big" id="startBtn">경기 시작</button>
        <div class="league">
          <button class="ghost" id="leagueBtn" aria-pressed="false">리그 모드 끔</button>
          <button class="ghost" id="bossBtn" aria-pressed="false">보스전 끔</button>
          <small>리그: 50초부터 빨라지고 피해가 커져요 · 보스전: 고른 선수 모두가 한 팀(토벌단)이 되어 보스와 싸워요 (보스와 보스 체력은 아래 '보스' 탭에서)</small>
        </div>
      </div>
      <div class="overlay" id="winOv" hidden>
        <div class="win-face" id="winFace"></div>
        <h2 id="winText">승리!</h2>
        <button class="big" id="againBtn">다시 하기</button>
        <button class="ghost" id="quickBtn">즉시 다시하기</button>
      </div>
    </div>
    <div class="players" id="players"></div>
  </div>
  </div>

  <div class="side">
  <div class="controls">
    <button id="restartBtn">다시 시작</button>
    <button class="ghost" id="pauseBtn">일시정지</button>
    <label class="vol" for="volSl">소리 <input type="range" id="volSl" min="0" max="100" value="70"> <span id="volTx">70</span></label>
    <select id="speedSel" aria-label="게임 속도">
      <option value="1">속도 ×1</option>
      <option value="1.5">속도 ×1.5</option>
      <option value="2">속도 ×2</option>
    </select>
  </div>

  <section class="slots">
    <div class="slots-head">
      <h4>선수 <span id="slotCount">2</span> / 10 <span class="mode" id="modeLabel">개인전</span></h4>
    </div>
    <div class="palette" id="palette" aria-label="캐릭터 (끌어서 팀에 넣기)"></div>
    <div class="tabs" id="teamTabs" role="tablist"></div>
    <div class="teambox" id="slotList"></div>
    <p class="hint" id="slotHint">캐릭터를 끌어서 팀 탭이나 아래 칸에 놓으면 그 팀에 들어가요. 눌러도 지금 고른 팀에 들어가요. + 를 누르면 팀이 하나 늘어요. 공은 2개부터 10개까지, 같은 팀끼리는 서로 공격하지 않아요.</p>
  </section>

  <section class="panel">
    <h4>스킬 설명</h4>
    <div id="skillDesc" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  </div>
</div>

<script>
(() => {
let W = 500, mapScale = 1;   // 맵 크기 (설정): 맵이 커지면 캐릭터와 무기는 상대적으로 작아 보임
const BODY_DMG_PER_SPEED = 0.1;
// 넉백 규칙: 튕겨내는 공격은 아주 빠르게 날리고(knock), 벽 충돌 피해는 속도가 아니라
// "정면으로 벽에 박았을 때의 최대 피해(slamMax)" 기준으로 정함 → 피해 = slamMax × (벽 쪽 속도 / 날아간 속도)   // 기본공: 상대 쪽으로 향하는 속도 330px/s 정면 충돌 = 33 데미지
const cv = document.getElementById('arena'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 캐릭터 목록 ---------- */
// speed: 이동 속도(px/s), r: 공 반지름

const PALETTE = ['#3d7bf0', '#e5483b', '#2fae5a', '#f2b630', '#9b59d0', '#ef7fb0', '#1fb5c4', '#f08a2c', '#6b6f7a', '#8bc34a'];
const COLOR_NAMES = { '#3d7bf0': '파랑', '#e5483b': '빨강', '#2fae5a': '초록', '#f2b630': '노랑', '#9b59d0': '보라', '#ef7fb0': '분홍', '#1fb5c4': '하늘', '#f08a2c': '주황', '#6b6f7a': '회색', '#8bc34a': '연두' };
// 같은 색 공이 2개 이상이면 팀전: 색 = 팀
let teamMode = false;
function computeTeams(){
  const cnt = {};
  for (const sl of slots) cnt[sl.color] = (cnt[sl.color] || 0) + 1;
  teamMode = !bossMode && Object.values(cnt).some(n => n >= 2);
  if (bossMode) {
    const label = `보스전 · 토벌단 ${slots.length}명 vs ${bossDef().name}`;
    if ($('modeLabel')) $('modeLabel').textContent = label;
    if ($('startHint')) $('startHint').textContent = label;
    if ($('slotHint')) $('slotHint').textContent = '보스전에선 고른 선수 모두가 한 팀(토벌단)이에요. 1명부터 10명까지 넣을 수 있어요. 보스 탭에서 보스와 보스 체력을 정해요.';
    return;
  }
  if ($('slotHint')) $('slotHint').textContent = SLOT_HINT;
  const label = teamMode
    ? '팀전 · ' + Object.entries(cnt).map(([c, n]) => `${COLOR_NAMES[c] || '팀'} ${n}`).join(' vs ')
    : '개인전';
  if ($('modeLabel')) $('modeLabel').textContent = label;
  if ($('startHint')) $('startHint').textContent = teamMode ? label : '개인전 · 마지막까지 살아남으면 승리';
}
const SLOT_HINT = '캐릭터를 끌어서 팀 탭이나 아래 칸에 놓으면 그 팀에 들어가요. 눌러도 지금 고른 팀에 들어가요. + 를 누르면 팀이 하나 늘어요. 공은 2개부터 10개까지, 같은 팀끼리는 서로 공격하지 않아요.';

/* ---------- 소리 ---------- */
let actx = null, soundOn = true, master = null, volume = .7;
function audio(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = volume; master.connect(actx.destination); } catch {}
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'sine', vol = .15, slideTo = 0){
  if (!soundOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = .25, freq = 1800){
  if (!soundOn || !actx) return;
  const n = actx.sampleRate * dur, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq;
  s.buffer = buf; g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start();
}
const sfx = {
  hit(power){ noise(.18, .2 + power * .3); tone(150 - power * 60, .25, 'sine', .25 + power * .2, 45); },
  bump(){ tone(200, .08, 'sine', .12, 120); },
  staff(){ noise(.12, .35, 3200); tone(260, .15, 'square', .08, 120); },
  claw(){ noise(.08, .18, 5000); },
  clawHit(){ noise(.1, .3, 4000); tone(500, .08, 'square', .06, 250); },
  tail(){ noise(.25, .25, 900); },
  slam(power){ noise(.25, .3 + power * .3, 900); tone(90, .3, 'sine', .3, 40); },
  clash(){ tone(1400, .18, 'triangle', .12, 900); tone(1900, .12, 'triangle', .06); },
  wall(){ tone(520, .05, 'triangle', .04); },
  count(hi){ tone(hi ? 880 : 440, hi ? .35 : .15, 'square', .08); },
  ko(){ tone(300, .8, 'sawtooth', .15, 40); noise(.5, .4); },
  boom(){ noise(.45, .35, 700); tone(130, .3, 'sawtooth', .1, 50); }
};

      P.push(m); p.minions.push(m);

/* ---------- 균열 ---------- */
function makeCrack(x, y, size){
  const n = 9 + (Math.random() * 4 | 0), hole = [], rays = [], debris = [];
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU + rand(-.15, .15);
    hole.push([Math.cos(a) * size * rand(.4, .7), Math.sin(a) * size * rand(.4, .7)]);
  }
  const rc = 6 + (Math.random() * 4 | 0);
  for (let k = 0; k < rc; k++) {
    let a = rand(0, TAU), r = size * .55, pts = [[Math.cos(a) * r, Math.sin(a) * r]];
    const len = size * rand(1.1, 1.9), segs = 3 + (Math.random() * 2 | 0);
    for (let s = 1; s <= segs; s++) {
      a += rand(-.45, .45); r = size * .55 + (len - size * .55) * s / segs;
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      if (Math.random() < .3) rays.push([pts[pts.length - 1], [Math.cos(a + rand(-.8, .8)) * (r + size * .35), Math.sin(a + rand(-.8, .8)) * (r + size * .35)]]);
    }
    rays.push(pts);
  }
  for (let k = 0; k < 5; k++) {
    const a = rand(0, TAU), r = size * rand(.9, 1.4), s = size * rand(.06, .14);
    debris.push([Math.cos(a) * r, Math.sin(a) * r, s, rand(0, 6)]);

}
function drawCrack(c){
  const fade = Math.min(1, (c.life - c.age) / 1.2);
  ctx.save(); ctx.translate(c.x, c.y); ctx.globalAlpha = Math.max(0, fade);
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#6b6b6b'; ctx.lineWidth = 1.3;
  for (const r of c.rays) { ctx.beginPath(); ctx.moveTo(r[0][0], r[0][1]); for (const p of r.slice(1)) ctx.lineTo(p[0], p[1]); ctx.stroke(); }
  ctx.beginPath(); c.hole.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = '#cfcfcf'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#4a4a4a'; ctx.stroke();
  ctx.beginPath(); c.hole.forEach((p, k) => k ? ctx.lineTo(p[0] * .6 + 2, p[1] * .6 + 2) : ctx.moveTo(p[0] * .6 + 2, p[1] * .6 + 2)); ctx.closePath();
  ctx.fillStyle = '#a9a9a9'; ctx.fill();
  ctx.fillStyle = '#d6d6d6'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
  for (const d of c.debris) {

    ctx.beginPath(); ctx.moveTo(-d[2], -d[2] * .6); ctx.lineTo(d[2], -d[2]); ctx.lineTo(d[2] * .8, d[2] * .7); ctx.lineTo(-d[2] * .7, d[2]); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }

}

/* ---------- 데미지 ---------- */
function damage(att, tgt, dmg, cx, cy, power, atkId, opt = {}){
  if (dmg <= 0 || tgt.dead || tgt.invincible) return;
  const ls = leagueStage();
  if (ls && ls.dmg !== 1) dmg = Math.max(1, Math.round(dmg * ls.dmg));
  if (att && att.charmT > 0) dmg = Math.max(1, Math.round(dmg * BOSS.charm.weak));   // 유혹: 공격력 감소
  if (att && att.lastT > 0 && att.def.lastStand) dmg = Math.max(1, Math.round(dmg * att.def.lastStand.dmgMul));   // 최후의 일격 중엔 조금 약하게
  // 랏코 회피기동: 충전이 있으면 맞지 않고 백스텝 + 반격
  if (tgt.def.dodge && !opt.noDodge && att && att !== tgt && !gone(tgt) && tgt.dodgeN >= 1 && state === 'fight') { rakkoDodge(tgt, att, cx, cy); return; }   // invincible: 무적 상태용 (지금은 쓰는 캐릭터 없음)
  if (tgt.def.lastStand && !tgt.lastUsed && tgt.hp - dmg <= 1 && state === 'fight') {
    tgt.lastUsed = true; tgt.hp = 1; tgt.lastT = tgt.def.lastStand.time; tgt.invincible = true; tgt.flash = .18;
    floatText(tgt.x, tgt.y - tgt.r - 30, '최후의 일격!', '#c8372c', 24);
    startWarp(0, { time: .6, k: .25, delay: 0 });

    return;
  }

  const st = att && att.stats[atkId];
  if (st) { st.hits++; st.dealt += dmg; }
  floatText(tgt.x + (opt.textDy ? 22 : 0), tgt.y - tgt.r - 10 + (opt.textDy || 0), '-' + dmg, opt.color || '#111', 18 + Math.min(16, dmg * .6));
  if (opt.crack !== false) {

}

/* ---------- 몸통 충돌 (기본공만 데미지) ---------- */
function bodyHit(a, b, va, vb, cx, cy){

  const contact = (x, y, v) => x.def.body ? Math.round(Math.max(0, v) * BODY_DMG_PER_SPEED)

  const power = Math.min(1, (toA + toB) / (CHARS.ball.speed * BODY_DMG_PER_SPEED * 1.4));
  const hit = (x, y, d) => d && damage(x.owner || x, y, d, cx, cy, power, x.def.bite ? 'mermaid' : 'body', { crack: !x.def.bite });
  hit(a, b, toB); hit(b, a, toA);

/* ---------- 선분 계산 ---------- */
function distPointSeg(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  const qx = x1 + dx * t, qy = y1 + dy * t;
  return [Math.hypot(px - qx, py - qy), qx, qy];
}
function segSegDist(a, b){
  let best = [Infinity, 0, 0];
  for (let k = 0; k <= 10; k++) {
    const t = k / 10;
    const r1 = distPointSeg(a[0] + (a[2] - a[0]) * t, a[1] + (a[3] - a[1]) * t, ...b);
    if (r1[0] < best[0]) best = r1;
  }
  return best;
}
// 원점(ox, oy)에서 start 각도부터 dir 방향으로 swept만큼 쓸고 간 부채꼴(반지름 reach)에 원이 걸리는지
function inSweep(ox, oy, start, dir, swept, reach, t){
  const dx = t.x - ox, dy = t.y - oy, dist = Math.hypot(dx, dy);
  if (dist - t.r > reach) return false;
  const tol = dist > t.r ? Math.asin(Math.min(1, t.r / dist)) : Math.PI;
  const rel = angDiff(start, Math.atan2(dy, dx)) * dir;
  return rel >= -tol && rel <= swept + tol;
}

/* ---------- 우사기 토벌창 ---------- */
function staffPivot(p){
  const foe = p.foe, s = p.def.staff;
  if (!foe) return [p.x, p.y];
  const a = Math.atan2(foe.y - p.y, foe.x - p.x);
  return [p.x + Math.cos(a) * s.pivot, p.y + Math.sin(a) * s.pivot];
}
function staffSeg(p){
  const s = p.def.staff, c = Math.cos(p.staffA), d = Math.sin(p.staffA), [px, py] = staffPivot(p);
  return [px - c * s.back, py - d * s.back, px + c * s.front, py + d * s.front];
}
function usagiStep(p, dt, fighting){
  const s = p.def.staff, foe = p.foe;
  p.staffCd = Math.max(0, p.staffCd - dt);
  for (const k in p.swingCd) p.swingCd[k] -= dt;
  p.phT += dt;
  p.speedMul = p.ph === 'swing' ? 1.15 : .8;   // 휘두르기 중엔 조금 빠르게, 폭발 중엔 조금 느리게
  if (fighting && p.hp <= p.maxHp * .17 && p.foe && !p.knock) {
    // 궁지에 몰리면 가장 가까운 적 쪽으로 서서히 방향을 틀며 쫓아감
    const want = Math.atan2(p.foe.y - p.y, p.foe.x - p.x), cur = Math.atan2(p.vy, p.vx), sp = Math.hypot(p.vx, p.vy);
    const a = cur + Math.max(-2.2 * dt, Math.min(2.2 * dt, angDiff(cur, want)));
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
  }
  if (p.ph === 'swing') {
    // 2.5초 동안 계속 휘두르기를 3번 (매번 회전 방향 랜덤, 사이에 잠깐 멈춤)
    const bout = s.swingTime + s.rest, k = Math.floor(p.phT / bout), local = p.phT - k * bout;
    if (k !== p.swingIdx && k < s.swings) { p.swingIdx = k; if (k > 0) p.staffDir = Math.random() < .5 ? -1 : 1; }
    p.swinging = k < s.swings && local < s.swingTime;
    if (p.swinging) { p.staffA += p.staffDir * s.spin * dt; if (fighting) p.stats.swing.active += dt; }
    if (p.phT >= bout * s.swings - s.rest) { p.ph = 'aim'; p.phT = 0; p.swinging = false; p.blastCount = 0; renderAttacks(); }
  } else {
    if (fighting) p.stats.blast.active += dt;
    if (foe) { const want = Math.atan2(foe.y - p.y, foe.x - p.x); p.staffA += angDiff(p.staffA, want) * Math.min(1, dt * 18); }
    if (p.ph === 'aim' && p.phT >= s.aimTime) { p.ph = 'blast'; p.phT = s.blastGap; }
    if (p.ph === 'blast') {
      if (p.blastCount < s.blasts && p.phT >= s.blastGap) {

        if (foe) p.staffA = Math.atan2(foe.y - p.y, foe.x - p.x);
        if (fighting) blast(p);
      } else if (p.blastCount >= s.blasts && p.phT >= s.blastHold) {

        renderAttacks();
      }
    }
  }
  if (!fighting || !p.swinging) return;
  const seg = staffSeg(p);
  for (const t of P) {
    if (!foes(p, t) || gone(t) || (p.swingCd[t.i] || 0) > 0) continue;
    const [d, qx, qy] = distPointSeg(t.x, t.y, ...seg);
    // 자기 몸 안쪽 구간은 제외: 맞은 지점이 몸 바깥이어야 함
    if (d < t.r + s.width / 2 && Math.hypot(qx - p.x, qy - p.y) > p.r * .6) {
      p.swingCd[t.i] = s.hitGap;   // 같은 적 연속 타격 간격, 적의 이동 방향은 그대로
      const nx = t.x - p.x, ny = t.y - p.y, nl = Math.hypot(nx, ny) || 1;
      const cx = t.x - nx / nl * t.r, cy = t.y - ny / nl * t.r;
      damage(p, t, s.dmg, cx, cy, .45, 'swing', { crack: false });
      yellowDust(cx, cy, nx / nl, ny / nl);
      sfx.staff(); renderAttacks();
    }
  }
}
// 창끝에서 부채꼴(샷건) 모양으로 폭발.
// 파동이 waveTime 동안 창끝 → 범위 끝으로 퍼지고, 파동 앞머리가 닿는 순간 피해를 준다 (창끝에 가까울수록 큰 데미지)
function blast(p){
  const s = p.def.staff, A = p.staffA, c = Math.cos(A), d = Math.sin(A), [px, py] = staffPivot(p);
  const tipX = px + c * s.front, tipY = py + d * s.front;
  for (let k = 0; k < 34; k++) {
    const a = A + rand(-s.fanHalf, s.fanHalf) * rand(.6, 1), gas = Math.random() < .6;
    const reach = s.fanRange * rand(.35, 1.05), drag = rand(3, 4.5);
    clouds.push({
      x: tipX, y: tipY, vx: Math.cos(a) * reach * drag, vy: Math.sin(a) * reach * drag, dr: drag,
      r: rand(4, 8), grow: rand(16, 32), age: rand(-s.waveTime * .5, 0), life: rand(.55, 1),
      color: gas ? ['#f2a93b', '#f7c948', '#e8892e', '#f0b850'][k % 4] : ['#b3b3b3', '#c8c8c8', '#9f9f9f'][k % 3]
    });
  }
  for (let k = 0; k < 16; k++) {
    const a = A + rand(-s.fanHalf, s.fanHalf), sp = s.fanRange / s.waveTime * rand(.7, 1.1);
    clouds.push({ spark: true, x: tipX, y: tipY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dr: 2, age: rand(-.06, 0), life: rand(.2, .35), r: 0, grow: 0 });
  }
  clouds.push({ arc: true, x: tipX, y: tipY, a: A, half: s.fanHalf, range: s.fanRange, dur: s.waveTime, age: 0, life: s.waveTime + .12 });
  waves.push({ p, x: tipX, y: tipY, a: A, half: s.fanHalf, range: s.fanRange, dur: s.waveTime, age: 0, hit: new Set() });

function waveStep(dt){
  for (const w of waves) {
    w.age += dt;
    if (w.age > w.dur || state !== 'fight') continue;
    const s = w.p.def.staff, front = w.range * Math.min(1, w.age / w.dur);
    for (const t of P) {
      if (!foes(w.p, t) || gone(t) || w.hit.has(t.i)) continue;
      const dx = t.x - w.x, dy = t.y - w.y, dist = Math.hypot(dx, dy);
      const tol = dist > t.r ? Math.asin(Math.min(1, t.r / dist)) : Math.PI;
      if (dist - t.r <= front && dist < w.range + t.r * .5 && Math.abs(angDiff(w.a, Math.atan2(dy, dx))) <= w.half + tol) {

        renderAttacks();
      }
    }
  }
  waves = waves.filter(w => w.age < w.dur + .3);
}

/* ---------- 아노코 ---------- */

}
function knockAway(t, by, vx, vy, atkId, slamMax){

}
// 덮친 적을 놓아줌. throwIt이면 앞쪽으로 강하게 날려보냄
function releasePrey(p, throwIt){
  const t = p.prey; if (!t) return;
  p.prey = null; t.grabbed = null;
  const a = throwIt ? p.face : rand(0, TAU), c = Math.cos(a), d = Math.sin(a), gap = p.r + t.r + 2;
  t.x = Math.max(t.r, Math.min(W - t.r, p.x + c * gap));
  t.y = Math.max(t.r, Math.min(W - t.r, p.y + d * gap));
  if (throwIt) {
    const lp = p.def.leap;
    knockAway(t, p, c * lp.throwSpeed, d * lp.throwSpeed, 'leap', lp.slamMax);
    burst(t.x, t.y, '#cfd6c0', 16, 260); sfx.tail();
  } else { t.vx = c * t.speed; t.vy = d * t.speed; }
}
function pickTarget(p){
  const list = P.filter(q => foes(p, q) && !gone(q));
  return list.length ? list[Math.random() * list.length | 0] : null;
}
function anokoStep(p, dt, fighting){
  const cl = p.def.claw, tl = p.def.tail, lp = p.def.leap;
  // 앞쪽 = 이동 방향 (부드럽게 따라감). 도약 중엔 표적 쪽
  if (fighting && !p.hold && !p.air && (p.vx || p.vy)) p.face += angDiff(p.face, Math.atan2(p.vy, p.vx)) * Math.min(1, dt * 10);
  p.aT += dt;
  p.clawing = false;
  const act = id => { if (fighting) p.stats[id].active += dt; };
  if (p.aph === 'claw') {
    act('claw');
    const k = Math.floor(p.aT / cl.gap), local = p.aT - k * cl.gap;
    if (k < cl.swipes && k !== p.clawIdx) { p.clawIdx = k; p.clawHit.clear(); p.clawSide = k % 2 ? -1 : 1; if (fighting) sfx.claw(); }
    if (k < cl.swipes && local < cl.swipe) {
      p.clawing = true;
      p.clawAng = p.face + p.clawSide * (cl.from + (cl.to - cl.from) * local / cl.swipe);
    }
    if (p.aT >= cl.swipes * cl.gap) {
      p.aph = 'tail'; p.aT = 0; p.tailHit.clear();
      p.tailDir = Math.random() < .5 ? -1 : 1;
      p.tailStart = p.face + Math.PI - p.tailDir * tl.half;   // 부채꼴 한쪽 옆면 끝에서 시작
      if (fighting) sfx.tail();
      renderAttacks();
    }
  } else if (p.aph === 'tail') {
    act('tail');
    const e = Math.min(1, p.aT / tl.sweep);
    p.tailAng = p.tailStart + p.tailDir * tl.half * 2 * (1 - (1 - e) * (1 - e));   // 반대쪽 옆면 끝까지
    if (p.aT >= tl.sweep + tl.hold) {
      p.tailCount++; p.aT = 0; p.clawIdx = -1;
      p.aph = 'claw';
      if (p.tailCount >= tl.sets) {
        p.tailCount = 0;
        p.target = fighting ? pickTarget(p) : null;
        if (p.target) { p.aph = 'aim'; p.hold = true; }
      }
      renderAttacks();
    }

    // 제자리에서 표적을 가만히 바라봄
    act('leap');

    p.face += angDiff(p.face, Math.atan2(p.target.y - p.y, p.target.x - p.x)) * Math.min(1, dt * 8);
    // 고양이처럼 몸을 낮추고 슬금슬금 뒤로 물러남 (막판엔 거의 멈춰서 힘을 모음)
    const back = lp.creep * Math.max(0, 1 - p.aT / (lp.aim * .85));
    p.x = Math.max(p.r, Math.min(W - p.r, p.x - Math.cos(p.face) * back * dt));
    p.y = Math.max(p.r, Math.min(W - p.r, p.y - Math.sin(p.face) * back * dt));
    if (p.aT >= lp.aim) {
      p.aph = 'jump'; p.aT = 0;
      p.jumpFrom = [p.x, p.y];
      p.jumpDur = lp.jumpBase + Math.hypot(p.target.x - p.x, p.target.y - p.y) * lp.jumpPerPx;
      p.air = 1e-6;
      noise(.2, .2, 1200);
    }
  } else if (p.aph === 'jump') {
    // 표적을 향해 점프: 지형과 다른 공을 무시하고 날아감
    act('leap');
    const t = p.target, e = Math.min(1, p.aT / p.jumpDur), ease = 1 - (1 - e) * (1 - e);
    const tx = gone(t) && !t.air ? (p.lastTx ?? t.x) : t.x, ty = gone(t) && !t.air ? (p.lastTy ?? t.y) : t.y;

      burst(p.x, p.y, '#bbb', 14, 200);

    p.tickT -= dt;
    if (p.tickT <= 0 && fighting) {
      p.tickT += lp.tick;
      const a = rand(0, TAU);
      damage(p, t, lp.dmg, p.x + Math.cos(a) * p.r * .6, p.y + Math.sin(a) * p.r * .6, .3, 'leap', { crack: false });
      burst(p.x + rand(-p.r, p.r) * .6, p.y + rand(-p.r, p.r) * .6, '#fff', 5, 140);
      sfx.clawHit(); renderAttacks();
    }
    p.selfT -= dt;
    if (p.selfT <= 0 && fighting) {
      p.selfT += lp.selfTick;
      damage(null, p, lp.selfDmg, p.x, p.y, .1, null, { crack: false, textDy: 26, color: '#8a2be2' });
    }
    if (t.dead) { p.prey = null; endLeap(p); return; }
    if (p.aT >= lp.grab) { releasePrey(p, true); endLeap(p); }
  } else if (p.aph === 'recover') {
    if (p.aT >= lp.recover) { p.aph = 'claw'; p.aT = 0; p.clawIdx = -1; renderAttacks(); }
  }
  if (!fighting) return;
  if (p.clawing) {
    const seg = clawSeg(p);
    for (const t of P) {
      if (!foes(p, t) || gone(t) || p.clawHit.has(t.i)) continue;
      const [d, qx, qy] = distPointSeg(t.x, t.y, ...seg);
      if (d < t.r + 14) {
        p.clawHit.add(t.i);
        damage(p, t, cl.dmg, qx, qy, .4, 'claw', { crack: false });
        // 발톱 세 줄 자국 + 붉은 파편
        clouds.push({ slash: true, x: t.x, y: t.y, a: p.clawAng + Math.PI / 2 + p.clawSide * .35, age: 0, life: .6, r: 0, grow: 0 });
        for (let q = 0; q < 12; q++) {
          const a = p.clawAng + p.clawSide * -Math.PI / 2 + rand(-.7, .7), sp = rand(120, 320);
          parts.push({ x: qx, y: qy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(1.5, 3.5), color: q % 3 ? '#d62a2a' : '#fff', age: 0, life: rand(.25, .45) });
        }
        sfx.clawHit(); renderAttacks();
      }
    }
  }
  if (p.aph === 'tail' && p.aT <= tl.sweep) {
    const swept = Math.abs(p.tailAng - p.tailStart);
    for (const t of P) {
      if (!foes(p, t) || gone(t) || p.tailHit.has(t.i)) continue;
      if (inSweep(p.x, p.y, p.tailStart, p.tailDir, swept, p.r + tl.reach, t)) {

        damage(p, t, tl.dmg, t.x - dx / dl * t.r, t.y - dy / dl * t.r, .5, 'tail', { crack: false });
        burst(t.x - dx / dl * t.r, t.y - dy / dl * t.r, '#cfd6c0', 12, 220);

}
function endLeap(p){
  p.aph = 'recover'; p.aT = 0; p.hold = false; p.air = 0; p.target = null;
  const a = p.face + rand(-.6, .6);
  p.vx = Math.cos(a) * p.speed; p.vy = Math.sin(a) * p.speed;
  renderAttacks();
}

/* ---------- 치이카와 ---------- */
// 창은 몸 오른쪽에 들고 있음: 바라보는 방향 기준 오른쪽으로 hold만큼 옮긴 곳이 손
function forkFrame(p){
  const f = p.def.fork, a = p.forkA, c = Math.cos(a), d = Math.sin(a), nx = -d, ny = c;
  return { c, d, nx, ny, ox: p.x + nx * f.hold, oy: p.y + ny * f.hold, ext: p.jabExt * f.jabReach };
}
// 토벌창 모양 (Y자): 손잡이 끝에서 두 갈래가 부드럽게 벌어져 앞으로 뻗고, 끝은 바깥으로 살짝 휨

function prongPts(f, b, sd){

function forkSegs(p){
  const f = p.def.fork, { c, d, nx, ny, ox, oy, ext } = forkFrame(p), b = f.base + ext;
  const P2 = ([fx, fy]) => [ox + c * fx + nx * fy, oy + d * fx + ny * fy];

    const pts = prongPts(f, b, sd);
    for (let k = 0; k < pts.length - 1; k++) segs.push([...P2(pts[k]), ...P2(pts[k + 1])]);

}
function chiikawaStep(p, dt, fighting){
  const f = p.def.fork, owner = p.owner || p, statId = p.kind === 'hachiware' ? 'hachi' : 'tobeol';
  if (fighting && p.kind !== 'hachiware') p.stats.tobeol.active += dt;
  if (fighting && p.kind === 'hachiware' && owner.stats.hachi) owner.stats.hachi.active += dt;
  // 체력이 80% 이하면 하치와레 호출
  if (fighting && p.def.hachi && !p.hachiCalled && p.hp <= p.maxHp * p.def.hachi.atRatio) { spawnHachi(p); return; }
  if (fighting && p.def.rakko && !p.rakkoCalled && p.hp <= p.maxHp * p.def.rakko.atRatio) spawnRakko(p);
  for (const k in p.touchCd) p.touchCd[k] -= dt;
  p.fT += dt;
  // 1.6초 주기 중 앞부분에서 2번 찌르기 (나갔다 들어오는 데 jabTime)
  const k = Math.floor(p.fT / (f.jabTime + f.jabGap)), local = p.fT - k * (f.jabTime + f.jabGap);
  p.jabbing = k < f.jabs && local < f.jabTime;
  if (p.jabbing && k !== p.jabIdx) { p.jabIdx = k; p.jabHit.clear(); if (fighting) noise(.07, .15, 3500); }
  p.jabExt = p.jabbing ? Math.sin(Math.PI * local / f.jabTime) : 0;
  if (p.fT >= f.cycle) { p.fT = 0; p.jabIdx = -1; }
  // 가장 가까운 적을 향함 (찌르는 중엔 방향 고정)
  if (p.foe && !p.jabbing) p.forkA += angDiff(p.forkA, Math.atan2(p.foe.y - p.y, p.foe.x - p.x)) * Math.min(1, dt * 8);
  if (!fighting) return;
  const segs = forkSegs(p);
  for (const t of P) {
    if (!foes(p, t) || gone(t)) continue;
    let best = null;
    for (const sg of segs) {
      const r = distPointSeg(t.x, t.y, ...sg);
      if (r[0] < t.r + f.width / 2 + 2 && Math.hypot(r[1] - p.x, r[2] - p.y) > p.r * .7 && (!best || r[0] < best[0])) best = r;
    }

    if (p.jabbing && p.jabExt > .35 && !p.jabHit.has(t.i)) {

      p.jabHit.add(t.i); p.touchCd[t.i] = f.touchGap;

      for (let q = 0; q < 14; q++) {
        const a = Math.atan2(ny, nx) + rand(-.9, .9), sp = rand(120, 300);
        parts.push({ x: qx, y: qy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(1.5, 3.5), color: q % 3 ? f.color : '#fff', age: 0, life: rand(.3, .5) });
      }
      clouds.push({ stab: true, x: qx, y: qy, a: p.forkA, color: f.color, age: 0, life: .3, r: 0, grow: 0 });
      sfx.staff(); renderAttacks();

      p.touchCd[t.i] = f.touchGap;
      damage(owner, t, f.touchDmg, qx, qy, .2, statId, { crack: false });

}
// 하치와레: 가장 가까운 벽 밖에서 천천히 걸어와, 둘이 멈춰서 까르메라를 같이 먹고(회복) 함께 싸움
function spawnHachi(c){
  const hc = c.def.hachi;
  c.hachiCalled = true; c.waitHachi = true; c.hold = true; c.jabExt = 0; c.jabbing = false;
  const h = makePlayer({ kind: 'hachiware', name: '하치와레', hp: Math.max(10, Math.round(c.maxHp * hc.hpRatio)), color: c.color }, 0, 1);
  h.i = P.length; h.minion = true; h.owner = c; h.side = c.side;

  h.forkA = Math.atan2(c.y - h.y, c.x - h.x); h.face = h.forkA;

function endHachiWait(c){
  c.waitHachi = false; c.hold = false; c.munch = 0;
  const a = rand(0, TAU); c.vx = Math.cos(a) * c.speed; c.vy = Math.sin(a) * c.speed;
}
function hachiStep(h, dt, fighting){
  const c = h.owner, hc = c.def.hachi;
  if (!h.arriving) {
    // 합류한 뒤엔 체력이 조금씩 줄어듦
    if (fighting) h.hp = Math.max(0, h.hp - h.maxHp * hc.decayPerSec * dt);
    return;
  }
  h.aT2 += dt;
  if (c.dead) { h.dead = true; return; }
  if (c.grabbed) { endHachiWait(c); h.arriving = null; return; }
  const dx = c.x - h.x, dy = c.y - h.y, d = Math.hypot(dx, dy) || 1;
  // 둘 다 서로를 바라봄
  h.forkA = Math.atan2(dy, dx); c.forkA = h.forkA + Math.PI;
  if (h.arriving === 'walk') {

    const mv = Math.min(d - (h.r + c.r + 4), hc.walkSpeed * dt);
    if (mv > 0) { h.x += dx / d * mv; h.y += dy / d * mv; }
    if (d <= h.r + c.r + 6) { h.arriving = 'feed'; h.aT2 = 0; }
  } else if (h.arriving === 'feed') {
    // 나란히 서서 까르메라를 같이 먹음
    h.x = c.x - dx / d * (h.r + c.r + 4); h.y = c.y - dy / d * (h.r + c.r + 4);
    h.munch = c.munch = h.aT2;
    const step = Math.floor(h.aT2 / .45);
    if (step !== h.munchStep) {
      h.munchStep = step;
      const mx = (h.x + c.x) / 2, my = (h.y + c.y) / 2;
      floatText(mx + rand(-10, 10), my - 50, '냠냠', '#c07a00', 16);
      for (let q = 0; q < 6; q++) parts.push({ x: mx + rand(-8, 8), y: my - 20, vx: rand(-60, 60), vy: rand(-80, -20), g: 500, r: rand(1.5, 3), color: q % 2 ? '#a0582a' : '#f2c46a', age: 0, life: rand(.5, .8) });
      tone(420 + step * 40, .06, 'triangle', .06);
    }
    if (h.aT2 >= hc.feed) {
      const before = c.hp;
      const goal = Math.min(c.maxHp, Math.round(c.maxHp * hc.healRatio));
      c.hp = Math.max(c.hp, c.hp + (goal - c.hp) * healMul()); c.hp = Math.round(c.hp); c.trail = Math.max(c.trail, c.hp);
      floatText(c.x, c.y - c.r - 10, '+' + Math.round(c.hp - before), '#1f9e45', 26);
      for (let q = 0; q < 16; q++) { const a = rand(0, TAU), sp = rand(60, 180); parts.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 200, r: rand(2, 3.5), color: q % 2 ? '#f7d64a' : '#fff', age: 0, life: rand(.5, .9) }); }
      tone(660, .1, 'triangle', .1); setTimeout(() => tone(990, .2, 'triangle', .1), 90);
      h.arriving = null; h.munch = 0;
      endHachiWait(c);
      const a = rand(0, TAU); h.vx = Math.cos(a) * h.speed; h.vy = Math.sin(a) * h.speed;

}
// 토벌창 (Y자): 몸 오른쪽에 든 손잡이, 부드럽게 갈라지는 두 갈래, 갈래 안팎에 가시
function drawFork(p){

  for (const sd of [1, -1]) for (let k = 0; k < 3; k++) {
    const x = b + 16 + k * (L * .78 - 18) / 2;
    for (const io of [1, -1]) {   // 1 = 바깥쪽, -1 = 안쪽
      const y0 = S * sd + io * sd * f.width * .35, len = io > 0 ? 9.5 : 7.5;
      ctx.beginPath(); ctx.moveTo(x - 4.2, y0); ctx.lineTo(x + .6, y0 + io * sd * len); ctx.lineTo(x + 4.2, y0); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

function drawHelpers(){
  for (const h of helpers) {
    const pic = rakkoImg.complete && rakkoImg.naturalWidth ? rakkoImg : null;
    const body = (x, y, alpha) => {
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(x, y, h.r, 0, TAU); ctx.save(); ctx.clip();
      if (pic) ctx.drawImage(pic, x - h.r, y - h.r, h.r * 2, h.r * 2); else { ctx.fillStyle = '#f7e6c4'; ctx.fill(); }
      ctx.restore();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#0b0b0d'; ctx.beginPath(); ctx.arc(x, y, h.r, 0, TAU); ctx.stroke();
      ctx.restore();
    };
    if (h.hiddenDash && (h.ph === 'enter' || h.ph === 'exit')) continue;   // 화면이 느려진 뒤 잠깐 있다가 나타남
    if (h.ph === 'enter' || h.ph === 'exit') {
      // 돌진 잔상
      const w = h.ph === 'enter' ? WARP.enter : WARP.exit;
      for (let k = 4; k >= 1; k--) {
        const e = Math.max(0, Math.min(1, (h.t - w.delay) / h.rk.dashTime) - k * .07);
        body(h.from[0] + (h.to[0] - h.from[0]) * e, h.from[1] + (h.to[1] - h.from[1]) * e, .12 * (5 - k));
      }
    }
    drawSwingFx(h);
    body(h.x, h.y, 1);
    drawSword(h.x, h.y, h.swordA, h.r, h.swinging ? 1.5 : 1);
  }
}

// 검 휘두르기 공통 (도우미 랏코 / 캐릭터 랏코). plan 순서대로 휘두르고 cycle마다 반복
function swordStep(h, owner, face, plan, rk, dt, fighting, atkId){
  h.swingT = (h.swingT || 0) + dt;
  if (h.swingT >= rk.cycle) { h.swingT -= rk.cycle; h.swingIdx = -1; }
  const per = rk.swingTime + rk.swingGap, k = Math.floor(h.swingT / per), local = h.swingT - k * per, sw = plan[k];
  const was = h.swinging;
  h.swinging = !!sw && local < (sw.time || rk.swingTime);
  if (was && !h.swinging) clouds.push({ swingTrail: true, x: h.x, y: h.y, a0: Math.min(h.swingStart, h.swordA), a1: Math.max(h.swingStart, h.swordA), rr: h.r + h.curReach * .72, age: 0, life: .2, r: 0, grow: 0 });
  if (!h.swinging) { h.swordA += angDiff(h.swordA, face + .6) * Math.min(1, dt * 6); return; }
  if (k !== h.swingIdx) { h.swingIdx = k; h.swingHit.clear(); if (fighting) noise(sw.big ? .3 : .18, sw.big ? .4 : .3, sw.big ? 1800 : 2500); }
  h.curReach = sw.reach; h.curBig = !!sw.big;
  const e = local / (sw.time || rk.swingTime);
  h.swingStart = face - sw.dir * sw.arc;
  h.swordA = h.swingStart + sw.dir * sw.arc * 2 * (1 - (1 - e) * (1 - e));
  if (!fighting) return;
  const swept = Math.abs(h.swordA - h.swingStart);
  for (const q of P) {
    if (!foes(owner, q) || gone(q) || h.swingHit.has(q.i)) continue;
    if (inSweep(h.x, h.y, h.swingStart, sw.dir, swept, h.r + sw.reach, q)) {
      h.swingHit.add(q.i);
      const a = Math.atan2(q.y - h.y, q.x - h.x);
      damage(owner, q, sw.dmg, q.x - Math.cos(a) * q.r, q.y - Math.sin(a) * q.r, sw.big ? .7 : .5, atkId, { crack: false });
      clouds.push({ cut: true, x: q.x, y: q.y, a: h.swordA + Math.PI / 2, age: 0, life: .35, r: 0, grow: 0 });
      renderAttacks();
    }
  }
}
// 빠른 베기 연출: 칼날이 지나간 넓은 초승달 + 속도선 + 칼 잔상
function drawSwingFx(h){
  if (!h.swinging) return;
  const dir = h.swordA >= h.swingStart ? 1 : -1, a0 = Math.min(h.swingStart, h.swordA), a1 = Math.max(h.swingStart, h.swordA);
  const rIn = h.r + 14, rOut = h.r + h.curReach * .72;
  ctx.save();
  ctx.globalAlpha = h.curBig ? .5 : .38; ctx.fillStyle = h.curBig ? '#eaf3ff' : '#ffffff';
  ctx.beginPath(); ctx.arc(h.x, h.y, rOut + 10, a0, a1); ctx.arc(h.x, h.y, rIn, a1, a0, true); ctx.closePath(); ctx.fill();
  ctx.lineCap = 'round';
  for (const [rr, lw, al] of [[rOut + 10, 3, .9], [rOut - 12, 2, .6], [rOut - 34, 1.5, .45], [rIn + 18, 1.5, .35]]) {
    ctx.globalAlpha = al; ctx.strokeStyle = '#2b2118'; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(h.x, h.y, rr, a0 + (dir > 0 ? (a1 - a0) * .35 : 0), a1 - (dir < 0 ? (a1 - a0) * .35 : 0)); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;

function sirenStep(p, dt, fighting){

}

// 화음:덩굴 — 인어 수만큼(최소 1개) 표적과 가까운 벽들에서 덩굴이 자라 나가 표적을 묶음
function startVine(p){
  const t = vineTarget(p); if (!t) return;
  const n = Math.max(1, merCount(p));
  const walls = [[t.x, 0, t.y], [t.x, W, W - t.y], [0, t.y, t.x], [W, t.y, W - t.x]].sort((a, b) => a[2] - b[2]);
  for (let k = 0; k < n; k++) {
    const [ax, ay] = walls[k % 4];
    // 같은 벽을 또 쓰면 뿌리 위치를 조금 옮김
    const off = k >= 4 ? rand(-60, 60) : 0;
    const bx = ax === 0 || ax === W ? ax : Math.max(10, Math.min(W - 10, ax + off));
    const by = ay === 0 || ay === W ? ay : Math.max(10, Math.min(W - 10, ay + off));
    p.vines.push({ ax: bx, ay: by, tx: bx, ty: by, target: t, st: 'grow', t: -k * .15, tickT: 0 });

function vineStep(p, dt, fighting){
  const sv = p.def.siren.vine, mer = merCount(p);
  for (const v of p.vines) {
    const t = v.target;
    v.t += dt;
    if (v.t < 0) continue;   // 덩굴이 조금씩 시간차를 두고 나옴
    if (v.st === 'grow') {
      // 인어가 많을수록 빨리 뻗음
      const speed = sv.baseSpeed + sv.perMermaid * mer;
      const dx = t.x - v.tx, dy = t.y - v.ty, d = Math.hypot(dx, dy) || 1, mv = Math.min(d, speed * dt);
      v.tx += dx / d * mv; v.ty += dy / d * mv;
      if (t.dead || gone(t) || v.t > sv.maxTime) v.st = 'retract';
      else if (Math.hypot(t.x - v.tx, t.y - v.ty) < t.r) {
        v.st = 'bind'; v.t = 0; v.tickT = 0;
        floatText(t.x, t.y - t.r - 30, '묶임!', '#2f7d32', 20);
        burst(t.x, t.y, '#5aa04a', 10, 160);
      }
    } else if (v.st === 'bind') {
      v.tx = t.x; v.ty = t.y;
      v.tickT -= dt;
      if (v.tickT <= 0 && fighting && !gone(t)) {
        v.tickT += sv.tick;
        const a = rand(0, TAU);
        damage(p, t, sv.dmg, t.x + Math.cos(a) * t.r, t.y + Math.sin(a) * t.r, .2, 'vine', { crack: false });
        parts.push({ x: t.x + Math.cos(a) * t.r, y: t.y + Math.sin(a) * t.r, vx: Math.cos(a) * 60, vy: -80, g: 300, r: 3, color: '#5aa04a', age: 0, life: .6 });
        renderAttacks();

      if (v.t >= sv.bind || t.dead || gone(t)) v.st = 'retract';
    } else {
      const dx = v.ax - v.tx, dy = v.ay - v.ty, d = Math.hypot(dx, dy) || 1, mv = Math.min(d, 700 * dt);
      v.tx += dx / d * mv; v.ty += dy / d * mv;

}
// 인어: 세이렌의 표적을 쫓아다님
function mermaidStep(m, dt, fighting){
  const o = m.owner;
  if (!fighting || !o || o.dead) return;
  if (m.knock) return;
  let t = null, bd = Infinity;
  for (const q of P) if (foes(m, q) && !gone(q) && q.marks.has(o.i)) { const d = Math.hypot(q.x - m.x, q.y - m.y); if (d < bd) { bd = d; t = q; } }
  if (!t) {
    const ms = o.minions.filter(x => !x.dead && !gone(x));
    t = ms.length > 1 ? ms[(ms.indexOf(m) + 1) % ms.length] : o;
    if (gone(t)) return;
  }
  const want = Math.atan2(t.y - m.y, t.x - m.x), cur = Math.atan2(m.vy, m.vx), sp = Math.hypot(m.vx, m.vy);
  const a = cur + Math.max(-2.4 * dt, Math.min(2.4 * dt, angDiff(cur, want)));

// 조림: 세이렌의 상대가 닿으면 먹음 (체력 회복 + 복수 표식). 한 번 먹으면 사라짐
function dishStep(dt){

      d.eaten.add(p.i); d.count++;
      const h = Math.min(Math.round(dv.heal * healMul()), p.maxHp - p.hp);
      p.hp += h; p.trail = Math.max(p.trail, p.hp);

function drawDishes(){

/* ---------- 물리 ---------- */
function step(dt){
  const fighting = state === 'fight';
  for (const p of P) { if (!p.dead) p.foe = nearestFoe(p); p.binds = 0; }
  for (const p of P) {
    if (p.dead) continue;
    if (p.charmT > 0) p.charmT = Math.max(0, p.charmT - dt);
    if (p.bleedT > 0 && fighting) {
      // 출혈: 일정 간격으로 피해
      p.bleedT -= dt; p.bleedTick = (p.bleedTick || 0) - dt;
      if (p.bleedTick <= 0) {
        const bl = BOSS.ambush.bleed; p.bleedTick += bl.tick;
        damage(p.bleedBy, p, bl.dmg, p.x, p.y, .1, 'ambush', { crack: false, noDodge: true, color: '#b3122a' });
        parts.push({ x: p.x + rand(-p.r, p.r) * .5, y: p.y, vx: rand(-20, 20), vy: 30, g: 400, r: rand(2, 3.5), color: '#c0192f', age: 0, life: .7 });
      }
    }
  }
  for (const p of P) if (!p.dead) for (const v of p.vines) if (v.st === 'bind') v.target.binds++;
  for (const p of P) {
    if (p.dead || p.grabbed) continue;
    if (p.stun > 0) { p.stun = Math.max(0, p.stun - dt); p.vx *= .5; p.vy *= .5; if (p.stun > 0) continue; }   // 기절 중
    if (p.hold || p.air || p.under || p.arriving) { p.vx = 0; p.vy = 0; continue; }   // 제자리 / 공중 / 잠수: 스킬이 위치를 직접 정함
    if (p.knock) {
      // 꼬리에 맞아 날아가는 중: 속도 유지, 일정 시간이 지나면 원래대로
      p.knock.t -= dt;
      p.vx *= Math.exp(-dt * .6); p.vy *= Math.exp(-dt * .6);
      if (p.knock.t <= 0) p.knock = null;
    } else {
      const sp = Math.hypot(p.vx, p.vy) || 1;
      const vs = CHARS.seiren.siren.vine, slowK = Math.max(vs.slowMin, 1 - vs.slowPer * p.binds);
      const charmK = p.charmT > 0 ? BOSS.charm.slow : 1;
      const k = 1 + (p.speed * p.speedMul * slowK * charmK / sp - 1) * Math.min(1, dt * 3);
      p.vx *= k; p.vy *= k;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    let hitN = 0, wx = p.x, wy = p.y;
    if (p.x < p.r) { hitN = -p.vx; p.x = p.r; p.vx = Math.abs(p.vx); wx = 0; }
    if (p.x > W - p.r) { hitN = p.vx; p.x = W - p.r; p.vx = -Math.abs(p.vx); wx = W; }
    if (p.y < p.r) { hitN = Math.max(hitN, -p.vy); p.y = p.r; p.vy = Math.abs(p.vy); wy = 0; }
    if (p.y > W - p.r) { hitN = Math.max(hitN, p.vy); p.y = W - p.r; p.vy = -Math.abs(p.vy); wy = W; }
    if (hitN) {
      if (p.knock && fighting) {
        // 꼬리/도약 공습으로 밀려 벽에 부딪힘: 벽 쪽으로 향하던 속도에 비례한 피해
        const kn = p.knock, power = Math.min(1, hitN / kn.full);
        const dmg = Math.round(kn.slamMax * power);
        p.knock = null;
        const cx = wx === p.x ? p.x : wx, cy = wy === p.y ? p.y : wy;
        damage(kn.by, p, dmg, cx, cy, power, kn.atk);
        sfx.slam(power); renderAttacks();
      } else {
        const a = Math.atan2(p.vy, p.vx) + rand(-.087, .087), s = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s; sfx.wall();
      }
    }
  }
  // 공끼리 충돌
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const a = P[i], b = P[j];
    if (gone(a) || gone(b) || a.air > 0 || b.air > 0) continue;   // 공중에 있으면 부딪히지 않음
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01;
    if (d >= a.r + b.r) continue;

    // 제자리에 버티는 공(덮치는 중인 아노코 등)은 밀리지 않음
    const wa = a.hold ? 0 : b.hold ? 1 : .5, wb = 1 - wa;
    a.x -= nx * ov * wa; a.y -= ny * ov * wa; b.x += nx * ov * wb; b.y += ny * ov * wb;
    if (a.hold || b.hold) {
      const m = a.hold ? b : a, sgn = a.hold ? 1 : -1, vn = (m.vx * nx + m.vy * ny) * sgn;
      if (vn < 0) { m.vx -= 2 * vn * nx * sgn; m.vy -= 2 * vn * ny * sgn; sfx.bump(); }
      continue;
    }
    const pa = a.vx * nx + a.vy * ny, pb = b.vx * nx + b.vy * ny;
    if (pa - pb > 0) {
      a.vx += (pb - pa) * nx; a.vy += (pb - pa) * ny;
      b.vx += (pa - pb) * nx; b.vy += (pa - pb) * ny;
      const key = i + '-' + j;
      if (fighting && !(pairCd[key] > fightT)) { pairCd[key] = fightT + .15; bodyHit(a, b, pa, -pb, a.x + nx * a.r, a.y + ny * a.r); }
    }
  }
  // 스킬
  for (const p of P) {
    if (p.dead || p.grabbed || p.stun > 0) continue;   // 잡히거나 기절하면 공격 불가 (스킬도 멈춤)
    if (p.def.staff) usagiStep(p, dt, fighting);
    if (p.def.claw && !p.boss) anokoStep(p, dt, fighting);
    if (p.boss) bossStep(p, dt, fighting);
    if (p.def.siren) sirenStep(p, dt, fighting);
    if (p.kind === 'hachiware') hachiStep(p, dt, fighting);
    if (p.def.shift) hachi2Step(p, dt, fighting);
    if (p.def.fork && !p.arriving && !p.waitHachi && !p.forkDropped) chiikawaStep(p, dt, fighting);
    if (p.def.monster) beetleStep(p, dt, fighting);
    if (p.def.blade) { rakkoPlayerStep(p, dt, fighting); p.dodgeFlash = Math.max(0, (p.dodgeFlash || 0) - dt); }
    if (p.minion) mermaidStep(p, dt, fighting);
  }
  // 휘두르는 토벌창끼리 부딪히면 불꽃이 튀고 회전 방향이 바뀐다
  if (fighting) {
    const us = P.filter(p => p.def.staff && !gone(p));
    for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
      const a = us[i], b = us[j];
      if (!foes(a, b) || !(a.swinging || b.swinging) || a.staffCd > 0 || b.staffCd > 0) continue;
      const [d, qx, qy] = segSegDist(staffSeg(a), staffSeg(b));
      if (d < (a.def.staff.width + b.def.staff.width) / 2) {
        a.staffDir *= -1; b.staffDir *= -1; a.staffCd = b.staffCd = .2;
        burst(qx, qy, '#f4b81c', 12, 220); burst(qx, qy, '#fff', 6, 160);
        sfx.clash();
      }
    }
  }
  waveStep(dt);
  helperStep(dt, fighting);
  if (fighting) dishStep(dt);
  if (fighting) {
    fightT += dt;
    for (const p of P) if (p.def.body && !p.dead) p.stats.body.active += dt;
    checkDeaths();
  }
}

function fx(dt){
  for (const c of cracks) c.age += dt;
  cracks = cracks.filter(c => c.age < c.life);
  for (const q of parts) {
    q.age += dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.g) { q.vy += q.g * dt; q.vx *= Math.exp(-dt * 1.5); }   // 가루: 중력으로 떨어짐
    else { q.vx *= .94; q.vy *= .94; }
  }
  parts = parts.filter(q => q.age < q.life);
  for (const t of texts) { t.age += dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.age < t.life);
  for (const c of clouds) {
    c.age += dt;
    if (c.arc || c.slash || c.note || c.stab || c.slashLine || c.cut || c.swingTrail || c.ghost || c.dodgeRing || c.wind || c.shock || c.camFlash || c.bigSlash || c.redFlash || c.healRing || c.bigSwipe || c.age < 0) continue;
    const drag = Math.exp(-dt * (c.dr || 5));
    c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= drag; c.vy *= drag; c.r += c.grow * dt; c.grow *= Math.exp(-dt * 1.5);
  }
  clouds = clouds.filter(c => c.age < c.life);
  for (const p of P) { p.flash = Math.max(0, p.flash - dt); p.trail += (p.hp - p.trail) * Math.min(1, dt * 2.5); }
  shake = Math.max(0, shake - dt * 40);
  for (const d of drops) d.t += dt;
  drops = drops.filter(d => d.t < 2.5);
}

      g.addColorStop(0, 'rgba(255,70,70,.75)'); g.addColorStop(1, 'rgba(255,70,70,0)');

      continue;
    }
    if (c.healRing) {
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#2fae5a'; ctx.lineWidth = 6 * (1 - k) + 1;
      circlePath(ctx, c.x, c.y, c.r * (1 + k * .8)); ctx.stroke(); ctx.restore();
      continue;
    }

      for (const [o, lag] of [[-13, 0], [0, .15], [13, .3]]) {

        ctx.lineWidth = 6; ctx.strokeStyle = '#2b2118'; ctx.beginPath(); ctx.moveTo(o - 6, y0); ctx.lineTo(o - 6 + 12 * e, y1); ctx.stroke();
        ctx.lineWidth = 3.5; ctx.strokeStyle = '#e02424'; ctx.beginPath(); ctx.moveTo(o - 6, y0); ctx.lineTo(o - 6 + 12 * e, y1); ctx.stroke();
      }

    }

  }

}
// 덩굴 + 화음 연결선
function drawVines(){
  for (const p of P) {
    if (p.dead || !p.def.siren) continue;
    if (p.sph === 'vine') {
      // 세이렌과 인어들을 잇는 화음 선
      const ms = p.minions.filter(m => !m.dead && !m.grabbed);
      ctx.save(); ctx.lineWidth = 3; ctx.setLineDash([2, 7]); ctx.lineCap = 'round';
      ctx.globalAlpha = .45 + .25 * Math.sin(performance.now() / 120);
      ctx.strokeStyle = '#ef7fb0';
      for (const m of ms) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(m.x, m.y); ctx.stroke(); }
      ctx.strokeStyle = '#1fb5c4';
      for (let k = 0; k < ms.length; k++) { const a = ms[k], b = ms[(k + 1) % ms.length]; if (ms.length > 1) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
      ctx.restore();
    }
    for (const v of p.vines) {
      if (v.t < 0 && v.st === 'grow') continue;
      const dx = v.tx - v.ax, dy = v.ty - v.ay, L = Math.hypot(dx, dy);
      if (L < 2) continue;
      const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, N = Math.max(4, L / 10 | 0), tm = performance.now() / 200;
      const pts = [];
      for (let k = 0; k <= N; k++) {
        const s = k / N, w = Math.sin(s * L / 22 + tm) * 6 * Math.min(1, s * 4);
        pts.push([v.ax + dx * s + nx * w, v.ay + dy * s + ny * w]);
      }
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const [lw, col] of [[11, '#1f4d1a'], [7, '#4f9a3c']]) {
        ctx.lineWidth = lw; ctx.strokeStyle = col;
        ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      }
      // 잎
      for (let k = 2; k < N; k += 3) {
        const [x, y] = pts[k], side = k % 2 ? 1 : -1;
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx) + side * .9);
        ctx.fillStyle = '#6cc04a'; ctx.strokeStyle = '#1f4d1a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(8, 0, 8, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      // 벽에 박힌 뿌리
      ctx.fillStyle = '#3c2a1a'; ctx.beginPath(); ctx.arc(v.ax, v.ay, 9, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // 묶인 적을 감는 덩굴: 묶은 덩굴 수만큼 감김
    const bound = new Map();
    for (const v of p.vines) if (v.st === 'bind') bound.set(v.target, (bound.get(v.target) || 0) + 1);
    ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = '#2f6b26';
    const tm = performance.now() / 200;
    for (const [t, n] of bound) for (let k = 0; k < 1 + n; k++) {
      const yy = t.y - t.r * .5 + k * t.r / (n + .01) * .9;
      ctx.beginPath(); ctx.ellipse(t.x, Math.min(t.y + t.r * .5, yy), t.r + 3, t.r * .28, Math.sin(tm + k) * .15, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}
// 브리칭: 잠수 → 바닥 밑에서 추적(물결) → 뛰어오름
function drawBreach(p){
  const b = p.def.siren.breach, tm = performance.now() / 1000;
  const ripple = (x, y, k) => {
    ctx.save();
    ctx.fillStyle = 'rgba(40,110,170,.35)'; ctx.beginPath(); ctx.ellipse(x, y, p.r * .9, p.r * .5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(61,154,214,.8)'; ctx.lineWidth = 2;
    for (let q = 0; q < 3; q++) {
      const e = (tm * 1.6 + q / 3) % 1;
      ctx.globalAlpha = (1 - e) * k; ctx.beginPath(); ctx.ellipse(x, y, p.r * (.5 + e * .9), p.r * (.28 + e * .5), 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  };
  if (p.bph === 'dive') {
    const e = Math.min(1, p.sT / b.dive);
    ripple(p.x, p.y, e);
    ctx.save(); ctx.globalAlpha = 1 - e * .8;
    drawChar(ctx, { kind: p.kind, x: p.x, y: p.y + e * 10, r: p.r * (1 - .7 * e), color: p.color, name: p.name, img: p.img, flash: p.flash, ring: teamMode ? p.color : null });
    ctx.restore();
  } else if (p.bph === 'chase') {
    ripple(p.x, p.y, 1);
    // 등지느러미
    ctx.save(); ctx.translate(p.x, p.y - 4); ctx.rotate(p.face);
    ctx.fillStyle = '#c0565a'; ctx.strokeStyle = '#3a1d1d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.quadraticCurveTo(-4, -14 + Math.sin(tm * 12) * 2, 10, -2); ctx.lineTo(10, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (p.bph === 'rise') {
    const e = Math.min(1, p.sT / b.rise), lift = Math.sin(Math.PI * e) * 45, sc = 1 + .35 * Math.sin(Math.PI * e);
    ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * .3, p.r * .9, p.r * .4, 0, 0, TAU); ctx.fill(); ctx.restore();
    ripple(p.x, p.y, 1 - e);
    drawChar(ctx, { kind: p.kind, x: p.x, y: p.y - lift, r: p.r * sc, color: p.color, name: p.name, img: p.img, flash: p.flash, ring: teamMode ? p.color : null });
  }
}
// 우사기 퇴장: 대나무 프로펠러
function drawCopter(x, y, spin, grip){
  ctx.save(); ctx.translate(x, y);
  // 집게 (머리를 잡음)
  ctx.strokeStyle = '#2b2118'; ctx.fillStyle = '#c3c7cf'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const sx of [-1, 0, 1]) {
    const open = (1 - grip) * 7;
    ctx.beginPath(); ctx.moveTo(sx * 4, -4); ctx.lineTo(sx * (10 + open), 10); ctx.lineTo(sx * (7 + open), 18); ctx.lineTo(sx * 2, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#9aa0aa'; ctx.fillRect(-7, -9, 14, 7); ctx.strokeRect(-7, -9, 14, 7);
  // 막대
  ctx.fillStyle = '#d9b46a'; ctx.fillRect(-2.5, -40, 5, 31); ctx.strokeRect(-2.5, -40, 5, 31);
  // 날개 (돌아가는 모습: 폭이 cos로 줄었다 늘었다)
  const w = 38 * Math.abs(Math.cos(spin)) + 6, w2 = 38 * Math.abs(Math.sin(spin)) + 6;
  ctx.fillStyle = '#f2d58a';
  for (const ww of [w, w2]) {
    ctx.beginPath(); ctx.ellipse(0, -42, ww, 5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(43,33,24,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, -42, 44, 7, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#b07a3a'; ctx.beginPath(); ctx.arc(0, -42, 4, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawDeathAnims(){
  for (const d of deathAnims) {
    const t = d.t;
    // 0~0.6초 프로펠러가 내려옴 → 0.85초까지 집게로 잡음 → 위로 날아감
    const headY = d.y - d.r * .95;
    let cy, uy = d.y, sway = 0, grip = 0;
    if (t < .6) { const e = t / .6; cy = -70 + (headY + 70) * (1 - (1 - e) * (1 - e)); }
    else if (t < .85) { cy = headY; grip = (t - .6) / .25; }
    else { const e = t - .85; grip = 1; const up = 60 * e * e + 40 * e; cy = headY - up; uy = d.y - up; sway = Math.sin(e * 6) * 6; }
    drawChar(ctx, { kind: d.kind || 'usagi', x: d.x + sway, y: uy, r: d.r, color: d.color, name: d.name, img: d.img, ring: d.ring });
    drawCopter(d.x + sway, cy, t * 30, grip);
  }
}
function drawFrame(){
  if (!cv.width) return;

    // 버려진 토벌창: 잠시 놓여 있다가 희미해지며 사라짐
    ctx.save(); ctx.globalAlpha = d.t < 1 ? 1 : Math.max(0, 1 - (d.t - 1) / 1.5);
    const fall = Math.min(1, d.t / .25);
    drawFork({ def: { fork: d.fork }, forkA: d.a + .6 * fall, x: d.x, y: d.y + 6 * fall, jabExt: 0 });

  }

    ctx.save(); ctx.globalAlpha = .55; ctx.filter = 'grayscale(1)';
    drawChar(ctx, { kind: p.kind, x: p.x, y: p.y, r: p.r * (1 - .5 * (p.eaten || 0)), color: p.color, name: p.name, img: p.def.img2El && p.shiftK >= 1 ? p.def.img2El : null });
    ctx.restore();
  }
  for (const p of P) if (!p.air) drawPlayer(p);

  drawHelpers();
  drawClouds();
  drawTargets();
  for (const p of P) if (p.air) drawPlayer(p);
  for (const q of parts) { ctx.globalAlpha = 1 - q.age / q.life; ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (warpK < 1) {
    const I = (1 - warpK) / (1 - warpMin || 1) * (warpMin < .3 ? 1 : .6);
    ctx.save();
    ctx.fillStyle = `rgba(${warpCol},${(warpCol === '15,15,25' ? .18 : .3) * I})`; ctx.fillRect(-20, -20, W + 40, W + 40);
    ctx.translate(W / 2, W / 2); ctx.rotate(warpA);

    const tm = performance.now() / 1000;
    for (let k = 0; k < 16; k++) {
      const yy = ((k * 61) % 520) - 260, off = ((tm * 1400 + k * 97) % 900) - 450, len = 60 + (k * 37) % 90;
      ctx.globalAlpha = .55 * I; ctx.strokeStyle = k % 3 ? '#ffffff' : '#2b2118'; ctx.lineWidth = k % 3 ? 2 : 1.2;
      ctx.beginPath(); ctx.moveTo(off, yy); ctx.lineTo(off + len, yy); ctx.stroke();
    }
    ctx.restore();

    drawHelpers();
    for (const p of P) if (p.boss && !p.dead && (p.bph2 === 'dash' || p.bph2 === 'slash')) drawPlayer(p);
  }

  }

  const bossBarOn = bossMode && showBossBar && state !== 'ready' && P.some(p => p.boss);
  if (bossBarOn) {
    // 보스 체력바 (경기장 위쪽)
    const b = P.find(p => p.boss), k = Math.max(0, b.hp / b.maxHp), bw = 360, bx = (UW - bw) / 2, by = 10;
    ctx.save();
    ctx.fillStyle = '#2b2118'; ctx.fillRect(bx - 3, by - 3, bw + 6, 22);
    ctx.fillStyle = '#5a1e1e'; ctx.fillRect(bx, by, bw, 16);
    ctx.fillStyle = '#e5483b'; ctx.fillRect(bx, by, bw * k, 16);

    ctx.fillText(`보스 ${b.name}  ${Math.ceil(b.hp)} / ${b.maxHp}`, UW / 2, by + 8.5);

    ctx.save(); ctx.font = '700 15px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(txt).width + 18;
    ctx.globalAlpha = .85; ctx.fillStyle = '#2b2118'; ctx.fillRect(UW / 2 - w / 2, 8 + hudY, w, 24);
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.fillText(txt, UW / 2, 20.5 + hudY); ctx.restore();
  }
  if (league && state !== 'ready') {
    const st = leagueStage(), next = LEAGUE.slice().reverse().find(x => leagueT < x.t);
    const lines = ['리그 모드', st ? st.label : '일반', next ? `${next.t}초까지 ${Math.ceil(next.t - leagueT)}초` : `${Math.floor(leagueT)}초 경과`];
    ctx.save(); ctx.font = '700 12px "Noto Sans KR", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16;
    ctx.globalAlpha = .9; ctx.fillStyle = st ? (st.t >= 80 ? '#c8372c' : st.t >= 60 ? '#d6772a' : '#2b2118') : 'rgba(43,33,24,.75)';
    ctx.fillRect(8, 8 + hudY, w, 54); ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
    lines.forEach((l, k) => ctx.fillText(l, 16, 13 + hudY + k * 16));
    ctx.restore();
  }
  if (paused && state !== 'ready') {
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(0, 0, UW, UW);
    ctx.font = '56px "Black Han Sans", sans-serif'; ctx.fillStyle = '#111'; ctx.fillText('일시정지', UW / 2, UW / 2);
  }
}

      if (p.lastT > 0) { $('lf' + p.i).style.width = p.lastT / p.def.lastStand.time * 100 + '%'; $('lt' + p.i).textContent = Math.ceil(p.lastT) + '초'; }

    f.style.width = (r * 100) + '%';
    f.style.backgroundColor = r > .5 ? 'var(--hp)' : r > .2 ? 'var(--hp-mid)' : 'var(--hp-low)';
    $('t' + p.i).style.width = (p.trail / p.maxHp * 100) + '%';
    $('h' + p.i).textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
    $('pc' + p.i).classList.toggle('dead', p.dead || !!p.grabbed);

}
function isActive(p, id){
  if (state !== 'fight' || p.dead || p.grabbed) return false;
  if (id === 'swing') return p.ph === 'swing';
  if (id === 'blast') return p.ph !== 'swing';
  if (id === 'claw') return p.aph === 'claw';
  if (id === 'leap') return p.aph === 'aim' || p.aph === 'jump' || p.aph === 'grab';
  if (id === 'vine') return p.sph === 'vine';
  if (id === 'breach') return p.sph === 'breach';
  if (id === 'mermaid') return p.minions.some(m => !m.dead);
  if (id === 'tobeol') return !p.forkDropped;
  if (id === 'camera') return p.shiftK < 1;
  if (id === 'pclaw') return p.shiftK >= 1 && !p.pph;
  if (id === 'pounce') return !!p.pph;
  if (id === 'charm') return p.bph2 === 'charm';
  if (id === 'eat') return p.bph2 === 'eatGo' || p.bph2 === 'eating';
  if (id === 'bleap') return ['aim', 'jump', 'strike'].includes(p.bph2);
  if (id === 'spin') return p.bph2 === 'spin';
  if (id === 'ambush') return ['amAim', 'dash', 'slash'].includes(p.bph2);
  if (id === 'hachi') return p.minions.some(m => !m.dead);
  if (id === 'rakko') return helpers.some(h => h.owner === p);
  if (id === 'slash') return true;
  if (id === 'chase') return p.hp <= p.maxHp * .17;
  if (id === 'dodge') return p.dodgeN >= 1;
  if (id === 'back') return !!p.baPh;
  if (id === 'last') return p.lastT > 0;
  if (id === 'morph') return p.bst !== 'monster';
  if (id === 'punch') return p.bst === 'monster' && p.mph === 'punch';
  if (id === 'fly') return p.bst === 'monster' && p.mph !== 'punch';
  if (id === 'tail') return p.aph === 'tail';
  return false;
}
function renderAttacks(){
  for (const p of P) {
    const ul = $('a' + p.i); if (!ul) continue;
    const list = p.def.attacks.filter(a => (a.id !== 'hachi' || p.hachiCalled) && (a.id !== 'rakko' || p.rakkoCalled));
    ul.innerHTML = list.length
      ? list.map(a => {
          const st = p.stats[a.id];
          let extra = '';
          if (balance) {
            const avg = st.hits ? (st.dealt / st.hits).toFixed(1) : '-';
            const dps = fightT > 0 ? (st.dealt / fightT).toFixed(1) : '-';
            const adps = st.active > 0 ? (st.dealt / st.active).toFixed(1) : '-';
            extra = `<span class="stat">적중 ${st.hits}회 · 준 데미지 ${st.dealt} · 평균 ${avg}</span>`
                  + `<span class="stat">판 전체 DPS ${dps} · 사용 중 DPS ${adps} (${st.active.toFixed(1)}초 사용)</span>`;
          }
          return `<li class="${isActive(p, a.id) ? 'on' : ''}"><b>${a.name}</b><span>${a.short || a.desc.split(' · ')[0]}</span>${extra}</li>`;
        }).join('')
      : '<li class="none">공격 없음 · 맞기만 하는 샌드백</li>';
  }
}

function touchDrag(b, k){
  b.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const st = { x: e.clientX, y: e.clientY, ghost: null, over: null };
    const target = ev => { const el = document.elementFromPoint(ev.clientX, ev.clientY); return el && el.closest('.tab, .addtab, .teambox'); };
    const move = ev => {
      if (!st.ghost && Math.hypot(ev.clientX - st.x, ev.clientY - st.y) > 8) {
        st.ghost = b.querySelector('canvas').cloneNode(); st.ghost.getContext('2d').drawImage(b.querySelector('canvas'), 0, 0);
        Object.assign(st.ghost.style, { position: 'fixed', width: '48px', height: '48px', pointerEvents: 'none', zIndex: 50, opacity: .85 });
        document.body.append(st.ghost);
      }
      if (!st.ghost) return;
      ev.preventDefault();
      st.ghost.style.left = ev.clientX - 24 + 'px'; st.ghost.style.top = ev.clientY - 24 + 'px';
      const t = target(ev);
      if (t !== st.over) { st.over && st.over.classList.remove('drop'); t && t.classList.add('drop'); st.over = t; }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (!st.ghost) return;
      st.ghost.remove(); st.over && st.over.classList.remove('drop');
      b.dataset.dragged = '1'; setTimeout(() => delete b.dataset.dragged, 300);
      const t = target(ev); if (t) addToTeam(k, dropColor(t));
    };
    window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

/* ---------- 루프 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const speed = parseFloat($('speedSel').value) || 1;
  if (!paused && state !== 'ready') {
    if (warpT > 0) {
      warpT = Math.max(0, warpT - dt);
      warpK = warpT > WARP.ease ? warpMin : warpMin + (1 - warpMin) * (1 - warpT / WARP.ease);
    } else warpK = 1;
    const ls = leagueStage();
    let gdt = dt * speed * warpK * (ls ? ls.speed : 1);
    if (state === 'fight') leagueT += dt * speed;
    if (state === 'count') {
      countdown -= dt * speed;
      const n = Math.ceil(countdown) - 1;
      if (n < lastCount) { lastCount = n; sfx.count(n <= 0); }
      for (const p of P) {
        // 3,2,1 동안은 일정하게 돌고, FIGHT!가 뜬 1초 동안 감속해서 멈춘다
        if (countdown < 1) { const t = Math.max(0, countdown); p.arrowW = p.arrowW0 * t * t; }
        p.arrowA += p.arrowW * dt * speed;
        p.face = p.arrowA;
      }
      if (countdown <= 0) launch();
    } else if (state === 'ko') {
      slowmo -= dt; gdt *= .3;
      if (slowmo <= 0 && !deathAnims.some(d => d.t < 2.4)) { state = 'over'; showWin(); }
    }
    for (const d of deathAnims) d.t += dt * speed;   // 퇴장 모션도 배속을 따름
    deathAnims = deathAnims.filter(d => d.t < 3.2);
    if (state !== 'count') {
      const sub = 4;
      for (let k = 0; k < sub; k++) step(gdt / sub);
    }
    fx(state === 'ko' ? dt * .6 : gdt);
    updateHud();
    if (balance && (statTimer -= dt) <= 0) { statTimer = .25; renderAttacks(); }
  }
  drawFrame();
  requestAnimationFrame(loop);
}
function showWin(){
  const w = winner, face = $('winFace');
  if (!w) {
    face.style.backgroundImage = 'none'; face.style.width = face.style.height = '120px';
    $('winText').textContent = '무승부!';
  } else {
    // 팀전이면 이긴 팀원 전원 (쓰러진 팀원은 흐리게)
    const team = (teamMode || bossMode) ? P.filter(p => !p.minion && p.side === w.side) : [w], n = team.length;
    const cell = 240, c = document.createElement('canvas'); c.width = cell * n; c.height = cell;
    const g = c.getContext('2d');
    team.forEach((m, k) => {
      const u = m.kind === 'usagi' && !m.img;
      g.globalAlpha = m.dead ? .35 : 1;
      drawChar(g, { kind: m.kind, x: cell * k + cell / 2, y: u ? 140 : 120, r: u ? 70 : 96, color: m.color, name: m.name, img: m.img, ring: teamMode ? m.color : null });
    });
    face.style.width = Math.min(120 * n, 420) + 'px'; face.style.height = Math.min(120, 420 / n) + 'px';
    face.style.backgroundImage = `url(${c.toDataURL()})`;
    $('winText').textContent = bossMode ? (w.boss ? `보스 ${w.name} 승리!` : '토벌단 승리!') : teamMode ? `${COLOR_NAMES[w.color] || ''} 팀 승리!` : `${w.name} 승리!`;

}

  if (e.target.matches && e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); $('pauseBtn').click(); }
  if (e.key === 'r' || e.key === 'R') start();
  if (e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') toggleHitbox();
});

// 이 브라우저에 저장해 둔 설정 불러오기
function saveSetup(){
  try { localStorage.setItem('ballfight-setup', JSON.stringify({ slots: slots.map(({ kind, hp, color }) => ({ kind, hp, color })), teams, curTeam, vol: $('volSl').value, speed: $('speedSel').value, league, hpMode, showTimer, bossMode, showBossBar, bossKind, bossHp, map: Math.round(mapScale * 100) })); } catch {}
}
function loadSetup(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem('ballfight-setup')); } catch {}
  if (!d) return;
  const ok = (d.slots || []).filter(sl => CHARS[sl.kind] && !CHARS[sl.kind].hidden && PALETTE.includes(sl.color)).slice(0, 10);
  if (ok.length >= 1) { slots = ok; teams = (d.teams || []).filter(c => PALETTE.includes(c)); if (PALETTE.includes(d.curTeam)) curTeam = d.curTeam; }
  if (d.vol != null) { $('volSl').value = d.vol; volume = d.vol / 100; soundOn = volume > 0; $('volTx').textContent = d.vol; }
  if (['1', '1.5', '2'].includes(d.speed)) $('speedSel').value = d.speed;
  if (d.league) { league = true; $('leagueBtn').textContent = '리그 모드 켬'; $('leagueBtn').setAttribute('aria-pressed', true); }
  if (['card', 'over', 'ring'].includes(d.hpMode)) hpMode = d.hpMode;
  if (d.showTimer) { showTimer = true; $('timerToggle').setAttribute('aria-pressed', true); }
  if (d.showBossBar === false) { showBossBar = false; $('bossBarToggle').setAttribute('aria-pressed', false); }
  if (d.bossMode) { bossMode = true; $('bossBtn').textContent = '보스전 켬'; $('bossBtn').setAttribute('aria-pressed', true); }
  if (d.map >= 60 && d.map <= 160) setMapScale(d.map);
  if (BOSS_LIST.some(b => b.id === d.bossKind)) bossKind = d.bossKind;
  if (d.bossHp >= 10 && d.bossHp <= 99999) bossHp = d.bossHp;
}
loadSetup();
setHpMode(hpMode);
renderPalette();
renderSlots();
reset();
fit();
requestAnimationFrame(loop);
if (document.fonts) document.fonts.ready.then(() => { drawFrame(); renderPalette(); renderSlots(); });
})();
</script>
</body>
</html>
